name: AsyncPM Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-go-ingress:
    name: Test Golang Ingress
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go Tests
        run: |
          cd ingress-go
          go test -v ./...

  test-python-worker:
    name: Test Python ADK Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          cd worker-python
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Syntax & Imports
        run: |
          cd worker-python
          python -c "import main; print('Main module imported successfully')"

  build-docker-containers:
    name: Build Docker Containers
    runs-on: ubuntu-latest
    needs: [test-go-ingress, test-python-worker]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Stack
        run: |
          docker compose build